server:
  port: 8080

spring:
  application:
    name: all-stage-edu
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/all_stage_edu?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

asedu:
  file:
    upload-dir: ./uploads
  jwt:
    # HS256 密钥，长度至少 32 字节（生产环境须通过环境变量覆盖）
    secret: "AsEdu-All-Stage-2025-Frozen-System-JWT-Secret-Key-0001"
    # token 有效期（秒），与 sys_global_param.token_expire_minutes=120 对齐
    expire-seconds: 7200
    header: Authorization
    prefix: "Bearer "

logging:
  level:
    com.asedu: debug
    org.springframework.security: warn